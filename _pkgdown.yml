url: https://larsvanderlaan.github.io/hte3/

template:
  bootstrap: 5
  bslib:
    bg: "#f5f2e9"
    fg: "#263b3e"
    primary: "#39776c"
    code-bg: "#edf0e9"
    border-color: "#dcded4"

home:
  title: hte3
  description: Estimate conditional average treatment effects and risk ratios in R with DR-, R-, T-, and EP-learners.

navbar:
  structure:
    left: [intro, articles, reference, news]
    right: [search, github]
  components:
    intro:
      text: Overview
      href: index.html
    articles:
      text: Guides
      href: articles/index.html

reference:
  - title: Fit and predict
    contents:
      - hte_task
      - fit_cate
      - fit_crr
      - grf_cate
      - grf_crr
      - predict.hte3_model
      - hte3_example_data
  - title: Tasks and learner classes
    contents:
      - hte3_Task
      - make_hte3_Task_tx
      - make_cross_fitted
      - calibrate
      - estimate_m
      - estimate_mu
      - estimate_pi
      - make_ep_stack
      - make_grf_nuisance_learners
      - make_grf_cate_learners
      - make_grf_crr_learners
      - matches("^Lrnr_")
      - cross_validate
      - cross_validate_cate
      - cross_validate_crr
      - predict_hte3
      - get_autoML
      - truncate_propensity

articles:
  - title: Get started
    contents:
      - quickstart
      - cate
      - crr
      - grf
  - title: Methods
    contents:
      - ep-learner
      - advanced-sl3
  - title: Development
    contents:
      - extending-hte3
      - contributing
